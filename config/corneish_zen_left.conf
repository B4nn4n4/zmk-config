# Left half only (the split central) — shared options live in corneish_zen.conf.

# Expose USB charge state to the BLE host via BAS 1.1 Battery Level Status
# (src/charge_state.c). Left half only — the peripheral cannot push VBUS state
# over the split link.
CONFIG_ZMK_CHARGE_STATE_REPORTING=y

# Separate USB HID battery interface; HID_0 remains ZMK's keyboard interface.
CONFIG_ZMK_USB_BATTERY_REPORTING=y
# Third HID instance carries the right half's split telemetry.
CONFIG_USB_HID_DEVICE_COUNT=3
# Linux 6.19 names HID batteries by USB serial, shared by both battery interfaces.
# Empty USB serial makes it use distinct HID paths; BLE identity is unchanged.
CONFIG_USB_DEVICE_SN=""
