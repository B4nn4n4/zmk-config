CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y
# badjeff pmw3610 main branch: -alt driver (orientation now via DT invert-x,
# SMART_ALGORITHM has no equivalent and is dropped)
CONFIG_PMW3610_ALT=y

# Expose USB charge state to the BLE host via BAS 1.1 Battery Level Status
# (src/charge_state.c). Left half only — the peripheral cannot push VBUS state
# over the split link.
CONFIG_ZMK_CHARGE_STATE_REPORTING=y
