# User options applied on top of the board defconfigs.

# ZMK Studio (also requires the studio-rpc-usb-uart snippet in build-hatsu.yaml)
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Mouse FTW
CONFIG_ZMK_POINTING=y

# Six umlaut combos share the X key (default limit is 5)
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=8
