# User options applied on top of the board defconfigs.

# Temporary battery diagnostics over USB CDC; this conflicts with the Studio RPC
# USB-UART snippet, which is omitted from the diagnostic Hatsu build.
CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_STUDIO=n
CONFIG_SENSOR_LOG_LEVEL_DBG=y

# Mouse FTW
CONFIG_ZMK_POINTING=y

# Six umlaut combos share the X key (default limit is 5)
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=8
