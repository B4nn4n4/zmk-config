# Unified build — Zen + Tractyl (upstream main).
# Hatsu has its own pipeline (build-hatsu.yaml: HWMv2 custom boards + Studio snippet).
# See https://zmk.dev/docs/customization#building-additional-keyboards
---
include:
  # Corneish Zen v2 (HWMv2 IDs default to rev 2.0.0 = v2 hardware)
  - board: corneish_zen_left//zmk
  - board: corneish_zen_right//zmk
  # Tractyl (nice_nano defaults to rev 2.0.0 = v2 hardware)
  - board: nice_nano//zmk
    shield: tracktyl_left
  - board: nice_nano//zmk
    shield: tracktyl_right
